<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morph TV · Installation</title><style>body{font:18px/1.8 Arial;background:#edf1fc;color:#17243c;margin:0}main{max-width:940px;margin:auto;padding:28px}nav,.files{display:flex;gap:12px;flex-wrap:wrap}button,a{font:inherit}button,.files a{border:1px solid #a8b8d3;padding:10px 18px;border-radius:12px;background:white;color:#243e83}section{margin:24px 0;padding:24px;border-radius:20px;background:white}h1{line-height:1.4}li{margin:12px 0}.note{border-inline-start:5px solid #e3aa36;padding:16px;background:#fff7dd}a{color:#344caf}button:focus,a:focus{outline:3px solid #6962da}code{direction:ltr;unicode-bidi:isolate}</style><main><a href="https://morphtv.herroshetta.com">Morph TV</a><nav aria-label="Language"><button data-lang="ar">العربية</button><button data-lang="en">English</button><button data-lang="fr">Français</button></nav><h1 id="title"></h1><p id="intro"></p><div class="files" id="files"></div><div id="steps"></div><p><a href="mailto:support@herroshetta.com">support@herroshetta.com</a></p></main><script>
var rows={
ar:{title:'التثبيت بدون موبايل Android',intro:'مستخدم آيفون؟ يمكنك تنزيل الملفات من أي كمبيوتر. الفلاشة وسيلة لنقل الملفات؛ طريقة التثبيت تختلف حسب نظام الشاشة.',files:['Android TV / Google TV / Fire TV · APK','Android Legacy 4.4+ · APK','LG webOS 5+ · IPK','Samsung Tizen 5+ · حزمة الكمبيوتر (خيار توافق 4 موجود داخلها)','كل الملفات والدليل · ZIP'],sections:[['Android TV وGoogle TV وLegacy',['نزّل ملف APK المناسب، وانقله إلى فلاشة متوافقة مع التلفزيون. نسخة Legacy مخصصة لـAndroid 4.4 فأحدث؛ النسخة الرئيسية لـAndroid 8 فأحدث.','افتح الفلاشة من مدير الملفات على الشاشة، واضغط الملف. اسمح بالتثبيت من هذا المصدر إذا طلب النظام. تحتاج الشاشة دعم USB ومدير ملفات وتثبيت تطبيقات خارجية.','Fire TV يستخدم ملف Android نفسه. الفلاشة تحتاج منفذ USB أو محول OTG متوافق ودعم قراءة الملفات. في الأجهزة التي لا تدعم ذلك استخدم مسار تنزيل APK على الشاشة أو التثبيت من الكمبيوتر.']],['LG webOS · من الكمبيوتر',['ملف IPK لا يُثبّت بالضغط عليه من الفلاشة. ثبّت Developer Mode من متجر LG، وسجّل دخولك بحساب LG Developer. فعّل Developer Mode وأعد التشغيل ثم فعّل Key Server.','على الكمبيوتر ثبّت webOS CLI الرسمي، ثم استخدم ares-setup-device لإضافة عنوان IP الشاشة باسم myTV، مع المستخدم prisoner والمنفذ 9922. استخدم ares-novacom --device myTV --getkey وأدخل Passphrase الظاهر بالشاشة.','ثبّت الملف بالأمر: ares-install --device myTV Morph-TV-LG-0.8.126.ipk ثم شغّله من الشاشة. الكمبيوتر والتلفزيون على نفس الشبكة.','جدّد جلسة Developer Mode قبل انتهائها؛ انتهاء الجلسة قد يحذف تطبيقات التطوير. هذه نسخة تجريبية غير مؤكدة على شاشة فعلية.']],['Samsung Tizen 4.0 فأحدث · من الكمبيوتر',['نزّل حزمة الكمبيوتر ZIP وفك الضغط. هذه ملفات التطبيق المجهزة للتوافق وليست ملفًا يثبت مباشرة من الفلاشة. تستهدف موديلات 2018 فأحدث مثل N5300؛ الأجهزة الأقدم غير مدعومة حاليًا.','ثبّت Tizen Studio مع TV Extension وSamsung Certificate Extension من سامسونج. فعّل Developer Mode على التلفزيون وأدخل IP الكمبيوتر، ثم أعد تشغيل التلفزيون بالكامل.','لشاشات Tizen 4.0 فقط: انسخ config-tizen4.xml مكان config.xml قبل استيراد المشروع. النسخة الافتراضية تستهدف Tizen 5.0 فأحدث. من Tizen Studio افتح File ثم Import ثم Tizen Project، واختر المجلد أو الأرشيف. لو لم يُكتشف المشروع، أنشئ مشروع TV Web وانسخ ملفات الحزمة إليه مع config.xml.','اربط الشاشة من Device Manager، وأنشئ شهادة Samsung خاصة بك تشمل DUID الشاشة، ثم اسمح بتثبيت التطبيقات. اختر Run As ثم Tizen Web Application. التحديث يحتاج نفس شهادة المالك الأصلية؛ احتفظ بها.','دعم الأجهزة القديمة تجريبي: اختُبرت بدائل الواجهة بمحاكاة قدرات أقدم، ولم تُجرَ تجربة فعلية على N5300.']],['Samsung USB · يحتاج حزمة خاصة',['ملف WGT العادي لا يثبت مباشرة من USB. سامسونج توفر USB Demo Packaging Tool داخل Seller Office لإنتاج TMG ومعه ترخيص.','حزمة TMG غير متوفرة في هذا التنزيل. لا تغيّر امتداد ZIP أو WGT إلى TMG. يلزم إصدارها من سامسونج قبل إعلان تثبيت USB متاح.']]]},
en:{title:'Install without an Android phone',intro:'Using an iPhone? Download the files on a computer. A USB drive can carry them, but installation depends on the TV operating system.',files:['Android TV / Google TV / Fire TV · APK','Android Legacy 4.4+ · APK','LG webOS 5+ · IPK','Samsung Tizen 5+ · computer package (Tizen 4 option included)','All files and guide · ZIP'],sections:[['Android TV, Google TV and Legacy',['Download the appropriate APK and copy it to a TV-compatible USB drive. Legacy targets Android 4.4+; the main build requires Android 8+.','Open the APK using the TV file manager and allow installation from that source when prompted. USB storage, a file manager and sideloading support are required.','Fire TV uses the same Android APK. USB requires a supported port or OTG adapter and file access. Otherwise download the APK on the device or install from a computer.']],['LG webOS · computer installation',['An IPK cannot be installed by opening it on USB. Install Developer Mode from the LG store and sign in with an LG Developer account. Enable Developer Mode, restart, then enable Key Server.','Install the official webOS CLI on your computer. Use ares-setup-device to add the TV IP as myTV, user prisoner, port 9922. Run ares-novacom --device myTV --getkey and enter the Passphrase shown on the TV.','Run ares-install --device myTV Morph-TV-LG-0.8.126.ipk and launch from the TV. Keep both devices on the same network.','Extend the Developer Mode session before expiry; expiry can remove development apps. This preview has not been verified on a physical LG TV.']],['Samsung Tizen 4.0+ · computer installation',['Download and extract the computer ZIP package. These are prepared application files, not a direct USB installer. Targets 2018 and newer TVs such as N5300; earlier models are currently unsupported.','Install Tizen Studio, TV Extension and Samsung Certificate Extension. Enable TV Developer Mode, enter the computer IP and fully restart the TV.','For Tizen 4.0 only: replace config.xml with config-tizen4.xml before importing. The default package targets Tizen 5.0+. In Tizen Studio select File, Import, Tizen Project and choose the folder or archive. If not detected, create a TV Web project and copy the package contents including config.xml into it.','Connect the TV in Device Manager. Create your own Samsung certificate including the TV DUID, permit installation, then select Run As, Tizen Web Application. Updates require the original author certificate; keep it safe.','Older TV support is experimental. Layout fallbacks passed capability simulation; N5300 physical testing is pending.']],['Samsung USB · special packaging required',['A normal WGT does not install directly from USB. Samsung Seller Office provides USB Demo Packaging Tool to generate TMG and its license file.','No TMG package is included here. Renaming ZIP or WGT does not create one. Samsung packaging must be completed before USB installation can be offered.']]]},
fr:{title:'Installer sans téléphone Android',intro:'Vous utilisez un iPhone ? Téléchargez les fichiers sur un ordinateur. Une clé USB peut les transporter, mais l’installation dépend du système du téléviseur.',files:['Android TV / Google TV / Fire TV · APK','Android ancien 4.4+ · APK','LG webOS 5+ · IPK','Samsung Tizen 5+ · archive ordinateur (option Tizen 4 incluse)','Tous les fichiers et le guide · ZIP'],sections:[['Android TV, Google TV et ancienne version',['Téléchargez le fichier APK adapté et copiez-le sur une clé USB compatible. L’ancienne version nécessite Android 4.4 ou plus ; la version principale nécessite Android 8 ou plus.','Ouvrez le fichier dans le gestionnaire de fichiers du téléviseur et autorisez cette source si le système le demande. Le téléviseur doit accepter le stockage USB et les installations externes.','Fire TV utilise le même APK Android. Une connexion USB ou un adaptateur OTG compatible est nécessaire. Sinon, téléchargez le fichier sur l’appareil ou installez-le depuis un ordinateur.']],['LG webOS · depuis un ordinateur',['Un fichier IPK ne s’installe pas directement depuis une clé USB. Installez Developer Mode depuis la boutique LG et connectez votre compte LG Developer. Activez le mode, redémarrez puis activez Key Server.','Installez l’outil officiel webOS CLI. Avec ares-setup-device, ajoutez l’adresse IP du téléviseur sous le nom myTV, utilisateur prisoner, port 9922. Lancez ares-novacom --device myTV --getkey et saisissez la Passphrase affichée sur le téléviseur.','Lancez ares-install --device myTV Morph-TV-LG-0.8.126.ipk puis ouvrez l’application sur le téléviseur. Les deux appareils doivent utiliser le même réseau.','Prolongez la session Developer Mode avant son expiration, qui peut supprimer les applications de développement. Cette version n’a pas été vérifiée sur un téléviseur LG réel.']],['Samsung Tizen 4.0 et plus · depuis un ordinateur',['Téléchargez et décompressez l’archive pour ordinateur. Elle contient les fichiers préparés de l’application, pas un programme d’installation USB. Cible : modèles de 2018 et suivants, dont N5300. Les modèles antérieurs ne sont pas pris en charge actuellement.','Installez Tizen Studio, TV Extension et Samsung Certificate Extension. Activez Developer Mode sur le téléviseur, saisissez l’adresse IP de l’ordinateur puis redémarrez complètement le téléviseur.','Pour Tizen 4.0 uniquement : remplacez config.xml par config-tizen4.xml avant l’importation. Par défaut, le projet cible Tizen 5.0+. Dans Tizen Studio, choisissez File, Import, Tizen Project puis le dossier ou l’archive. Si le projet n’est pas détecté, créez un projet TV Web et copiez les fichiers de l’archive, dont config.xml.','Connectez le téléviseur dans Device Manager. Créez votre certificat Samsung avec le DUID du téléviseur, autorisez l’installation puis choisissez Run As, Tizen Web Application. Conservez le certificat d’auteur original pour les mises à jour.','La compatibilité avec les anciens téléviseurs est expérimentale. Les mises en page ont été testées par simulation de capacités ; le test sur un N5300 réel reste à effectuer.']],['Samsung USB · préparation spéciale nécessaire',['Un WGT ordinaire ne s’installe pas directement depuis USB. Samsung Seller Office propose USB Demo Packaging Tool pour générer un fichier TMG et sa licence.','Cette archive ne contient pas de fichier TMG. Renommer un fichier ZIP ou WGT ne suffit pas. Le traitement Samsung doit être effectué avant de proposer cette installation.']]]}};
var names=['Morph-TV-Android-TV-0.8.126.apk','Morph-TV-Legacy-0.1.1.apk','Morph-TV-LG-0.8.126.ipk','Morph-TV-Samsung-Computer-0.8.126.zip','Morph-TV-Install-Kit-0.8.126.zip'];var modelNotes={"ar": ["توافق الموديلات المرسلة", ["Samsung UA43N5300: خيار Tizen 4 تجريبي في حزمة الكمبيوتر. استبدل config.xml بملف config-tizen4.xml قبل الاستيراد. يلزم Developer Mode وشهادة DUID. لم يتم اختباره على الجهاز نفسه.", "Samsung UA40F6400AR: منصة Legacy / Orsay وليست Tizen. النسخة الحالية لا تثبت عليه، ولا توجد حزمة Orsay منشورة.", "Toshiba 43L5780EV: النظام غير مؤكد من الملصق وحده. لو كان Smart Toshiba Portal فلا توجد حزمة Morph TV لهذا النظام. ملفات APK تحتاج Android.", "يمكن تشغيل نسخة Android TV على جهاز Android TV خارجي متوافق موصل عبر HDMI."]], "en": ["Reported model compatibility", ["Samsung UA43N5300: experimental Tizen 4 computer option. Replace config.xml with config-tizen4.xml before import. Developer Mode and TV DUID certificate required. Not physically tested.", "Samsung UA40F6400AR: Legacy / Orsay, not Tizen. Current package cannot install; no Orsay package published.", "Toshiba 43L5780EV: label alone does not confirm OS. If Smart Toshiba Portal, no Morph TV package exists. APK requires Android.", "A compatible external Android TV device connected by HDMI can run the Android TV version."]], "fr": ["Compatibilité des modèles signalés", ["Samsung UA43N5300 : option Tizen 4 expérimentale sur ordinateur. Remplacez config.xml par config-tizen4.xml. Developer Mode et certificat DUID requis. Essai physique en attente.", "Samsung UA40F6400AR : Legacy / Orsay, pas Tizen. Paquet actuel incompatible ; aucun paquet Orsay publié.", "Toshiba 43L5780EV : système non confirmé par cette étiquette. Aucun paquet Morph TV pour Smart Toshiba Portal. Un APK nécessite Android.", "Un appareil Android TV externe compatible relié en HDMI peut utiliser la version Android TV."]]};Object.keys(modelNotes).forEach(function(lang){rows[lang].sections.push(modelNotes[lang]);});
var downloaderNotes={"ar": ["التنزيل باستخدام Downloader", ["على Android TV أو Google TV أو Fire TV المتوافق، افتح تطبيق Downloader واكتب الكود 6443144 ثم Go.", "الكود يحمّل نسخة التلفزيون الأحدث مباشرة من رابط Morph TV الرسمي؛ يتطلب Android 8 فأحدث. ليس ملف الموبايل أو Samsung أو LG.", "بعد اكتمال التنزيل ثبّت APK، واسمح لـDownloader بتثبيت التطبيقات إذا طلب النظام."]], "en": ["Download with Downloader", ["On compatible Android TV, Google TV or Fire TV, open Downloader, enter 6443144 and choose Go.", "This downloads the latest TV APK from the official Morph TV URL. Requires Android 8+. It is not the phone, Samsung or LG package.", "Install the downloaded APK and allow Downloader to install apps if prompted."]], "fr": ["Télécharger avec Downloader", ["Sur Android TV, Google TV ou Fire TV compatible, ouvrez Downloader, saisissez 6443144 puis Go.", "Le code télécharge le dernier APK TV depuis le lien officiel Morph TV. Android 8+ requis ; ce n’est pas le paquet mobile, Samsung ou LG.", "Installez l’APK téléchargé et autorisez Downloader à installer des applications si demandé."]]};Object.keys(downloaderNotes).forEach(function(l){rows[l].sections.unshift(downloaderNotes[l]);});
function setLanguage(lang){var row=rows[lang]||rows.ar;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('title').textContent=row.title;document.getElementById('intro').textContent=row.intro;var box=document.getElementById('files');box.textContent='';names.forEach(function(name,i){if(document.body.dataset.offline&&i===4)return;var a=document.createElement('a');a.href=(document.body.dataset.offline?'':'/')+name;a.download=name;a.textContent=row.files[i];box.appendChild(a)});if(!document.body.dataset.offline){var compat=document.createElement('a');compat.href='/Morph-TV-Samsung-Tizen4-Computer-0.8.126.zip';compat.download='Morph-TV-Samsung-Tizen4-Computer-0.8.126.zip';compat.textContent=lang==='ar'?'سامسونج N5300 · حزمة Tizen 4 تجريبية جاهزة':lang==='fr'?'Samsung N5300 · paquet Tizen 4 expérimental':'Samsung N5300 · ready Tizen 4 experimental project';box.appendChild(compat);} box=document.getElementById('steps');box.textContent='';row.sections.forEach(function(item){var section=document.createElement('section'),h=document.createElement('h2'),ol=document.createElement('ol');h.textContent=item[0];section.appendChild(h);item[1].forEach(function(text){var li=document.createElement('li');li.textContent=text;ol.appendChild(li)});section.appendChild(ol);box.appendChild(section)});var lgGuide=document.createElement('section');var lgLink=document.createElement('a');lgLink.href='/lg-install.html#webos-manager';lgLink.textContent=lang==='ar'?'شرح LG بالخطوات: موبايل Android أو الكمبيوتر باستخدام webOS Dev Manager':lang==='fr'?'Guide LG détaillé : téléphone Android ou ordinateur avec webOS Dev Manager':'Detailed LG guide: Android phone or computer with webOS Dev Manager';lgGuide.appendChild(lgLink);box.appendChild(lgGuide);var sources=document.createElement('section');sources.innerHTML='<a href="https://developer.samsung.com/smarttv/develop/faq/application-installation.html">Samsung · USB</a> · <a href="https://developer.samsung.com/smarttv/develop/getting-started/creating-tv-applications/importing-tv-applications.html">Samsung · Tizen Studio</a> · <a href="https://webostv.developer.lge.com/develop/getting-started/developer-mode-app">LG · Developer Mode</a>';box.appendChild(sources)}document.querySelectorAll('[data-lang]').forEach(function(b){b.onclick=function(){setLanguage(b.dataset.lang)}});setLanguage(new URLSearchParams(location.search).get('lang')||'ar');
</script></html>
