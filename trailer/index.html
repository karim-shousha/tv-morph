<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Morph trailer</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#292c31}body{color:#fff;font:20px Arial;display:grid;place-items:center}</style></head><body><script>
/* HTTPS parent supplies YouTube's required Referer for packaged webOS apps. */
(function(){'use strict';var key=location.hash.slice(1);if(!/^[A-Za-z0-9_-]{11}$/.test(key)){document.body.textContent='No trailer is available.';return;}var player=document.createElement('iframe');player.title='YouTube trailer';player.allow='autoplay; encrypted-media; fullscreen; picture-in-picture';player.allowFullscreen=true;player.referrerPolicy='strict-origin-when-cross-origin';player.src='https://www.youtube.com/embed/'+key+'?autoplay=1&playsinline=1';document.body.appendChild(player);})();
</script></body></html>
