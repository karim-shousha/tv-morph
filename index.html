(function(){var lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'ar',data=null,platform=document.getElementById('platform'),selected=new URLSearchParams(location.search).get('platform');if(['android','samsung','lg','vidaa'].includes(selected))platform.value=selected;function t(ar,en){return lang==='ar'?ar:en}function el(tag,text,cls){var n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('lang').textContent=lang==='ar'?'English':'العربية';document.getElementById('title').textContent=t('شاشتك الجديدة تبدأ هنا.','Your new TV starts here.');document.getElementById('intro').textContent=t('نزّل النسخة المناسبة لجهازك من مكان واحد. الموبايل والتلفزيون لهم ملفان منفصلان.','Find the right version in one place. Phone and television use separate packages.');document.getElementById('choose').textContent=t('نوع الشاشة','TV system');document.getElementById('preview-note').textContent=t('نسخة تجريبية. التنزيل لا يعني دعم كل موديل؛ تأكد من نظام الشاشة قبل التثبيت. لا تحذف النسخة القديمة عند التحديث.','Preview software. Availability is not certification for every model. Check your TV system and install updates over the existing app.');document.getElementById('archive-title').textContent=t('كل الإصدارات','All versions');if(!data)return;var cards=document.getElementById('cards');cards.textContent='';data.platforms.forEach(function(p){if(p.id!=='phone'&&platform.value!=='all'&&p.id!==platform.value)return;var card=el('article','',p.id===platform.value?'selected':'');card.appendChild(el('span',p.available?t('متاح للتجربة','Available to test'):t('لا توجد نسخة تنزيل جاهزة','No downloadable build yet'),'status '+(p.available?'ready':'')));card.appendChild(el('h2',p.name));card.appendChild(el('p',p[lang==='ar'?'noteAr':'noteEn']));if(p.available){var a=el('a',t('تنزيل ','Download ')+p.version,'download');a.href=p.d
