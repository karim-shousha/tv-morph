<script>
(function(){var ar=document.documentElement.lang==='ar',sequence=0,pending={};document.getElementById('matches-back').setAttribute('aria-label',ar?'رجوع':'Back');document.getElementById('matches-back').onclick=function(){if(window.MatchesNative)MatchesNative.back()};window.MorphLocale={get:function(){return ar?'ar':'en'}};window.ClearNative=window.MatchesNative;window.Morph30={svg:function(name){var paths={matches:'<path d="M8 3h8v5a4 4 0 0 1-8 0zM8 5H4v2a4 4 0 0 0 4 4m8-6h4v2a4 4 0 0 1-4 4M12 12v5m-4 4h8m-7-4h6v4H9z"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 13 3M5 15a8 8 0 0 0 13 3"/>'};return '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(paths[name]||paths.matches)+'</svg>'}};window.matchResult=function(id,ok,value){var p=pending[id];if(!p)return;clearTimeout(p.timer);delete pending[id];ok?p.resolve(value):p.reject(new Error(String(value)))};window.MorphNative={call:function(action,payload){return new Promise(function(resolve,reject){var id=String(++sequence);pending[id]={resolve:resolve,reject:reject,timer:setTimeout(function(){delete pending[id];reject(new Error('schedule_timeout'))},20000)};if(window.MatchesNative)MatchesNative.request(id,!!payload.refresh);else matchResult(id,false,'schedule_unavailable')})}}})();
