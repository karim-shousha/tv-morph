<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Morph TV · إضافة اشتراك</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Morph TV</h1><h2 id="title">إضافة اشتراك إلى التلفزيون</h2><p id="hint"></p><form id="form" hidden><label>اسم المكتبة<input id="name" maxlength="60" value="My TV" autocomplete="off"></label><div id="url-fields"><label>السيرفر أو رابط M3U<input id="server" type="url" dir="ltr" maxlength="4096" autocomplete="off"></label><label id="port-row">Port · اختياري<input id="port" inputmode="numeric" maxlength="5" dir="ltr"></label></div><div id="credentials"><label>اسم المستخدم<input id="username" maxlength="256" autocomplete="off" dir="ltr"></label><label>كلمة السر<input id="password" type="password" maxlength="512" autocomplete="off" dir="ltr"></label></div><label id="mac-row">MAC address<input id="mac" maxlength="17" placeholder="00:1A:79:00:00:00" dir="ltr"></label><label id="file-row">ملف M3U · حتى 2 MB<input id="file" type="file" accept=".m3u,.m3u8,text/plain,audio/x-mpegurl"></label><button id="submit">حفظ وربط التلفزيون</button></form><p id="status" role="status" aria-live="polite"></p><small>امسح QR من صفحة الإضافة على التلفزيون. اتركها مفتوحة أثناء الربط. الرابط صالح لخمس دقائق، وبيانات الاشتراك مشفرة حتى تصل للتلفزيون.</small></main><script src="nacl-fast.min.js"></script><script src="phone.js"></script></body></html>
