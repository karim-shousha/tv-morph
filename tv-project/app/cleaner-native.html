<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>try{if(CleanerNative.isTelevision&&CleanerNative.isTelevision())document.querySelector('meta[name=viewport]').setAttribute('content','width=1920');}catch(ignore){}</script><link rel="stylesheet" href="cleaner.css"></head><body style="margin:0;background:#0b1a2c"><script src="cleaner.js"></script><script>
try{var theme=JSON.parse(CleanerNative.themeJson()),tokens=theme.tokens||{};document.documentElement.lang=theme.language||'en';var background=theme.background||'reference-assets/bridge-background-v2.webp';document.body.style.setProperty('--cleaner-system-background','var(--ui-cleaner-overlay,linear-gradient(transparent,transparent)),url('+JSON.stringify('../tv/'+background)+')');Object.keys(tokens).forEach(function(key){if(/^--ui-[a-z-]+$/.test(key)&&tokens[key])document.body.style.setProperty(key,tokens[key]);});}catch(ignore){}
var cleanerPending={},cleanerSequence=0;
window.cleanerResult=function(id,raw){var done=cleanerPending[id];if(!done)return;delete cleanerPending[id];try{var result=JSON.parse(raw);if(result.error)done(Error(result.error));else done(null,result);}catch(e){done(e);}};
function cleanerCall(action,payload,done){var id='cleaner-'+(++cleanerSequence);cleanerPending[id]=done;try{if(CleanerNative.request)CleanerNative.request(id,action,payload);else setTimeout(function(){try{cleanerResult(id,action==='scan'?CleanerNative.scan(payload):CleanerNative.remove(payload));}catch(e){delete cleanerPending[id];done(e);}},40);}catch(e){delete cleanerPending[id];done(e);}}
window.CleanerBackend=function(){return {chooseFolder:!CleanerNative.canChooseFolder||CleanerNative.canChooseFolder(),close:function(){cleanerPending={};},scan:function(scope,done){cleanerCall('scan',scope,done);},remove:function(ids,done){cleanerCall('remove',JSON.stringify(ids),done);}};};MorphCleaner.open();
</script></body></html>
