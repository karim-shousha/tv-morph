<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Morph TV · إدارة التعليقات</title><link rel="stylesheet" href="/landing.css?v=community-2"><script src="/community-admin.js?v=1" defer></script></head><body><main class="section admin-shell"><a class="secondary" href="/">← الموقع</a> <a class="secondary" href="/plus-admin">إدارة تفعيلات Plus</a><h1>إدارة التقييمات والتعليقات</h1><p>التقييمات تدخل فورًا. الموافقة تنشر التعليق والاسم الظاهر فقط؛ الرفض يخفي التعليق ويحتفظ بالتقييم. زر السبام يخفي الاثنين ويمكن التراجع عنه.</p><form id="admin-login" class="review-form"><label for="admin-password">كلمة مرور الإدارة</label><input id="admin-password" type="password" autocomplete="current-password" required maxlength="300"><button class="primary" type="submit">دخول</button></form><p id="admin-status" role="status"></p><section id="admin-content" hidden><div class="admin-toolbar"><select id="admin-filter" aria-label="تصفية التعليقات"><option value="pending">بانتظار المراجعة</option><option value="approved">المنشورة</option><option value="rejected">المخفية</option><option value="all">الكل (يشمل تقييمات بدون تعليق)</option></select><button class="secondary" id="admin-refresh">تحديث</button><button class="secondary" id="admin-logout">خروج</button></div><p id="admin-summary"></p><div id="admin-reviews"></div><button class="secondary" id="admin-more" hidden>تحميل المزيد</button></section></main></body></html>
