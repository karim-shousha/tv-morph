<!doctype html>
<html lang="ar" dir="rtl">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="description" content="مكتبة ألعاب PlayStation على Morph TV. ابحث واستعرض بيانات كل لعبة وحجمها.">
 <title>Morph Games · Morph TV</title>
 <link rel="stylesheet" href="games.css">
 <script src="games.js" defer></script>
</head>
<body>
 <a class="skip" href="#main">انتقل للمحتوى</a>
 <header class="site-header">
  <div class="wrap top">
   <a href="https://morph-tv.com/" class="brand" dir="ltr" aria-label="Morph TV">
    <img src="morph-mark.webp" alt="" width="116" height="38">
   </a>
   <nav aria-label="الموقع"><a href="https://morph-tv.com/#home">الرئيسية</a><a href="#" aria-current="page">الألعاب</a></nav>
  </div>
 </header>
 <main id="main" class="wrap">
  <section id="library-view">
   <div class="hero">
    <div class="hero-art" aria-hidden="true"><img src="winning.png" alt=""><img src="ctr.png" alt=""><img src="jackie.png" alt=""></div>
    <div class="hero-copy">
     <p class="eyebrow"><span></span> مكتبة <bdi>PlayStation</bdi></p>
     <h1 dir="ltr">Morph <em>Games</em></h1>
     <p>اختار لعبتك المفضلة، وشوف تفاصيلها وحجمها قبل التنزيل.</p>
     <a class="button primary" href="#library">تصفّح الألعاب <span aria-hidden="true">↓</span></a>
    </div>
   </div>
   <section id="library" aria-labelledby="library-heading">
    <div class="section-head"><h2 id="library-heading">مكتبة الألعاب</h2><span id="count" role="status" aria-live="polite"></span></div>
    <div class="toolbar">
     <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
      <span class="sr-only">ابحث في الألعاب</span><input id="search" type="search" placeholder="ابحث بالاسم أو النوع…" autocomplete="off">
     </label>
     <div class="filters" id="filters" aria-label="نوع اللعبة"></div>
    </div>
    <div class="game-grid" id="cards"></div>
    <div id="empty" class="empty" hidden><p>مفيش ألعاب مطابقة للبحث ده.</p><button id="clear" type="button" class="button">مسح البحث والفلاتر</button></div>
   </section>
  </section>
  <section id="detail" aria-labelledby="game-title" hidden></section>
  <noscript>فعّل JavaScript لعرض المكتبة والبحث فيها.</noscript>
 </main>
 <footer class="wrap"><a href="https://morph-tv.com/" dir="ltr">Morph TV</a><span>مكتبة الألعاب</span></footer>
</body>
</html>
