<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ربط اشتراك Morph TV</title><style>body{background:#071323;color:#f3f7ff;font:18px/1.8 Tahoma;margin:0}main{max-width:550px;margin:auto;padding:24px}label{display:block;margin-top:16px}input,select,button{box-sizing:border-box;width:100%;padding:15px;border:1px solid #577899;border-radius:12px;background:#10243b;color:white;font:inherit}button{margin-top:24px;background:linear-gradient(120deg,#0966af,#7135bc)}input{direction:ltr}small{color:#b9cce0}[hidden]{display:none!important}</style><main><h1>اربط اشتراكك بالتلفزيون</h1><p>اكتب البيانات واضغط ربط. اشتراكاتك السابقة تفضل محفوظة.</p><form id="form"><label>طريقة الإضافة<select id="type"><option value="xtream">السيرفر + اسم المستخدم + كلمة السر</option><option value="m3u">رابط الاشتراك كامل M3U</option><option value="portal">Stalker</option></select></label><label>اسم الاشتراك<input id="name" maxlength="60" value="My TV"></label><label>رابط السيرفر أو الاشتراك<input id="server" type="url" required maxlength="4096" placeholder="http://provider.example:8080" autocomplete="off"></label><div id="credentials"><label>اسم المستخدم<input id="username" maxlength="256" autocomplete="off"></label><label>كلمة السر<input id="password" type="password" maxlength="512" autocomplete="off"></label></div><label id="mac-row" hidden>MAC address<input id="mac" placeholder="00:1A:79:00:00:00" maxlength="17"></label><button id="submit">ربط الاشتراك بالتلفزيون</button></form><p id="status" role="status"></p><small>الربط محلي على نفس شبكة Wi-Fi. خلي شاشة QR مفتوحة على التلفزيون أثناء الإضافة.</small></main><script>
(function(){'use strict';var $=function(id){return document.getElementById(id);},key=location.hash.slice(1);history.replaceState(null,'',location.pathname);if(!/^[a-f0-9]{48}$/.test(key)){$('form').hidden=true;$('status').textContent='امسح QR جديد من التلفزيون.';return;}
$('type').onchange=function(){var type=$('type').value;$('credentials').hidden=type!=='xtream';$('mac-row').hidden=type!=='portal';};$('form').onsubmit=function(e){e.preventDefault();var type=$('type').value,account={type:type,name:$('name').value.trim()||'My TV',server:$('server').value.trim(),username:type==='xtream'?$('username').value.trim():'',password:type==='xtream'?$('password').value:'',mac:type==='portal'?$('mac').value.trim():'',format:'m3u8',live:true,vod:type!=='m3u',series:type!=='m3u'};var url;try{url=new URL(account.server);if(!/^https?:$/.test(url.protocol)||url.username||url.password)throw Error();}catch(error){$('status').textContent='اكتب رابط http أو https صحيح.';return;}if(type==='xtream'&&(!account.username||!account.password)){$('status').textContent='اكتب اسم المستخدم وكلمة السر.';return;}if(type==='portal'&&!/^([a-f0-9]{2}:){5}[a-f0-9]{2}$/i.test(account.mac)){$('status').textContent='راجع MAC address.';return;}
$('submit').disabled=true;$('status').textContent='جاري الربط…';fetch('/subscription-connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key,account:account})}).then(function(response){return response.json();}).then(function(result){if(!result.connected)throw Error(result.error||'تعذّر الربط. حاول مرة أخرى.');$('form').hidden=true;$('password').value='';$('status').textContent='تم ربط الاشتراك بالتلفزيون بنجاح ✓';key='';}).catch(function(error){$('status').textContent=error.message||'تعذّر الوصول للتلفزيون. تأكد من نفس الشبكة.';$('submit').disabled=false;});};})();
</script></html>
