name: Build and verify Morph Launcher for Mac
on:
  push:
    branches: [codex/desktop-macos]
    paths: [desktop-build/**, .github/workflows/desktop-macos.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and extract the shared runtime snapshot
        run: |
          python3 - <<'PY'
          import json,hashlib,zipfile,pathlib
          root=pathlib.Path('desktop-build')
          receipt=json.loads((root/'runtime.json').read_text())
          archive=root/receipt['file']
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==receipt['sha256']
          with zipfile.ZipFile(archive) as z:z.extractall('desktop')
          PY
      - name: Install build and test dependencies
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          command -v ffmpeg || brew install ffmpeg
      - name: Build one Mac application for Apple Silicon and Intel
        working-directory: desktop
        run: npx electron-builder --mac dmg zip --universal --publish never
      - name: Run application and mouse/playback regression on Apple Silicon
        working-directory: desktop
        env:
          MORPH_PC_TEST_EXECUTABLE: ${{ github.workspace }}/desktop/dist/mac-universal/Morph Launcher.app/Contents/MacOS/Morph Launcher
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morph-mac-universal
          path: |
            desktop/dist/Morph-Launcher-Mac-*.dmg
            desktop/dist/Morph-Launcher-Mac-*.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morph-mac-arm64-qa
          path: desktop/test-output/*.json
          retention-days: 7
  verify-intel:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: morph-mac-universal
          path: downloads
      - name: Extract runtime tests and universal Mac application
        run: |
          python3 -c "import zipfile; zipfile.ZipFile('desktop-build/morph-desktop-runtime.zip').extractall('desktop')"
          ditto -x -k downloads/Morph-Launcher-Mac-*-universal.zip mac-app
      - name: Install test dependencies
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          command -v ffmpeg || brew install ffmpeg
      - name: Verify the same application on Intel
        working-directory: desktop
        env:
          MORPH_PC_TEST_EXECUTABLE: ${{ github.workspace }}/mac-app/Morph Launcher.app/Contents/MacOS/Morph Launcher
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morph-mac-intel-qa
          path: desktop/test-output/*.json
          retention-days: 7
