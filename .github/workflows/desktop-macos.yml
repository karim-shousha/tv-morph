name: Build and verify Morph Launcher for Mac
on:
  push:
    branches: [codex/desktop-macos]
    paths: [desktop-build/**, .github/workflows/desktop-macos.yml]
  workflow_dispatch:
concurrency:
  group: morph-desktop-macos
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and extract the shared runtime snapshot
        run: |
          python3 - <<'PY'
          import json,hashlib,zipfile,pathlib
          root=pathlib.Path('desktop-build')
          receipt=json.loads((root/'runtime.json').read_text())
          archive=root/receipt['file']
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==receipt['sha256']
          with zipfile.ZipFile(archive) as z:z.extractall('desktop')
          PY
      - name: Install build and test dependencies
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium
          command -v ffmpeg || brew install ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: morph-mac-universal
          run-id: 42577811803
          github-token: ${{ github.token }}
          path: desktop/dist
      - name: Extract unchanged packaged application
        run: ditto -x -k desktop/dist/Morph-Launcher-Mac-1.1.366-universal.zip desktop/dist/mac-universal
      - name: Verify packaged runtime matches the final source snapshot byte for byte
        working-directory: desktop
        run: |
          node - <<'JS'
          const fs=require('fs'),path=require('path'),os=require('os'),assert=require('assert'),asar=require('@electron/asar');
          const target=fs.mkdtempSync(path.join(os.tmpdir(),'morph-asar-verify-'));
          asar.extractAll('dist/mac-universal/Morph Launcher.app/Contents/Resources/app.asar',target);
          let count=0;
          function walk(dir){for(const n of fs.readdirSync(dir)){const p=path.join(dir,n);if(fs.statSync(p).isDirectory())walk(p);else{assert(fs.readFileSync(p).equals(fs.readFileSync(path.join(target,p))),'Packaged frontend differs: '+p);count++;}}}
          walk('build/ui');
          for(const n of ['main.cjs','preload.cjs','lan.cjs','matches.cjs','vpn.cjs','updater.cjs','cleaner-files.cjs','local-media-response.cjs'])assert(fs.readFileSync(n).equals(fs.readFileSync(path.join(target,n))),n);
          assert.equal(JSON.parse(fs.readFileSync(path.join(target,'package.json'))).version,'1.1.366');
          console.log('Verified '+count+' packaged UI files and all native modules against final source');
          fs.rmSync(target,{recursive:true,force:true});
          JS
      - name: Run application and mouse/playback regression on Apple Silicon
        working-directory: desktop
        env:
          MORPH_TEST_NO_SCREENSHOTS: "1"
          MORPH_PC_TEST_EXECUTABLE: ${{ github.workspace }}/desktop/dist/mac-universal/Morph Launcher.app/Contents/MacOS/Morph Launcher
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morph-mac-universal
          path: |
            desktop/dist/Morph-Launcher-Mac-*.dmg
            desktop/dist/Morph-Launcher-Mac-*.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morph-mac-arm64-qa
          path: desktop/test-output/*.json
          retention-days: 7
  verify-intel:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: morph-mac-universal
          path: downloads
      - name: Extract runtime tests and universal Mac application
        run: |
          python3 -c "import zipfile; zipfile.ZipFile('desktop-build/morph-desktop-runtime.zip').extractall('desktop')"
          ditto -x -k downloads/Morph-Launcher-Mac-*-universal.zip mac-app
      - name: Install test dependencies
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium
          command -v ffmpeg || brew install ffmpeg
      - name: Verify the same application on Intel
        working-directory: desktop
        env:
          MORPH_TEST_NO_SCREENSHOTS: "1"
          MORPH_PC_TEST_EXECUTABLE: ${{ github.workspace }}/mac-app/Morph Launcher.app/Contents/MacOS/Morph Launcher
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morph-mac-intel-qa
          path: desktop/test-output/*.json
          retention-days: 7
