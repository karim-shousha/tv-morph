name: Build and verify Morph Launcher 1.1.352 for Mac

on:

  push:

    branches: [codex/release351-mac-20261108]

    paths: [desktop-build/**, .github/workflows/desktop-macos.yml]

  workflow_dispatch:

concurrency:

  group: morph-desktop-release351-20261108

  cancel-in-progress: true

permissions:

  contents: read

  actions: read

jobs:

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reuse the unchanged final universal application
        uses: actions/download-artifact@v4
        with:
          name: morph-mac-universal
          run-id: 42525402513
          github-token: ${{ github.token }}
          path: downloads
      - uses: actions/upload-artifact@v4
        with:
          name: morph-mac-universal
          path: downloads/*
          retention-days: 7

  verify:

    needs: package

    strategy:

      fail-fast: false

      matrix:

        include:

          - runner: macos-15

            arch: arm64

          - runner: macos-15-intel

            arch: intel

    runs-on: ${{ matrix.runner }}

    timeout-minutes: 30

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4

        with:

          node-version: '22'

      - uses: actions/download-artifact@v4

        with:

          name: morph-mac-universal

          path: downloads

      - name: Extract frozen runtime and packaged application

        run: |

          python3 -c "import zipfile;zipfile.ZipFile('desktop-build/morph-desktop-runtime.zip').extractall('desktop')"

          ditto -x -k downloads/Morph-Launcher-Mac-*-universal.zip mac-app

      - name: Install test dependencies

        working-directory: desktop

        run: |

          npm ci --no-audit --no-fund

          command -v ffmpeg || brew install ffmpeg

      - name: Bounded individual runtime checks

        working-directory: desktop

        env:

          MORPH_TEST_NO_SCREENSHOTS: "1"

          MORPH_PC_TEST_EXECUTABLE: ${{ github.workspace }}/mac-app/Morph Launcher.app/Contents/MacOS/Morph Launcher

        run: python3 ../desktop-build/run-mac-checks.py

      - uses: actions/upload-artifact@v4

        if: always()

        with:

          name: morph-mac-${{ matrix.arch }}-qa

          path: |

            desktop/test-output/*.json

            desktop/test-output/ci-*.log

          retention-days: 7

