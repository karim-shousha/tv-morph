name: Verify frozen Morph Mac 1.1.321 artifact
on:
  push:
    branches: [codex/final-desktop-20261107]
    paths: [desktop-qa/**, .github/workflows/mac-qa-reuse.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: morph-mac-universal
          path: downloads
          run-id: 42359848575
          github-token: ${{ github.token }}
      - name: Extract frozen runtime and packaged application
        run: |
          python3 -c "import zipfile;zipfile.ZipFile('desktop-build/morph-desktop-runtime.zip').extractall('desktop')"
          cp desktop-qa/desktop.cjs desktop/tests/desktop.cjs
          cp desktop-qa/prayer.cjs desktop/tests/prayer.cjs
          ditto -x -k downloads/Morph-Launcher-Mac-*-universal.zip mac-app
      - name: Install test dependencies
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          command -v ffmpeg || brew install ffmpeg
      - name: Bounded individual runtime checks
        working-directory: desktop
        env:
          MORPH_TEST_NO_SCREENSHOTS: "1"
          MORPH_PC_TEST_EXECUTABLE: ${{ github.workspace }}/mac-app/Morph Launcher.app/Contents/MacOS/Morph Launcher
        run: python3 ../desktop-build/run-mac-checks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morph-mac-${{ matrix.arch }}-qa
          path: |
            desktop/test-output/*.json
            desktop/test-output/ci-*.log
          retention-days: 7
