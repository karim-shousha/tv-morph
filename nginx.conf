server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 charset utf-8;
 server_tokens off;
 add_header X-Content-Type-Options nosniff always;
 location = /health { access_log off; default_type text/plain; return 200 'ok'; }
 location = /catalog.json { add_header Cache-Control 'no-store'; try_files $uri =404; }
 location = /download/android { default_type application/vnd.android.package-archive; add_header Content-Disposition 'attachment; filename="TV-Morph-Android-TV-0.8.2.apk"'; add_header Cache-Control 'no-cache'; try_files /TV-Morph-Android-TV-0.8.2.apk =404; }
 location = /download/phone { default_type application/vnd.android.package-archive; add_header Content-Disposition 'attachment; filename="TV-Morph-Phone-0.8.2.apk"'; add_header Cache-Control 'no-cache'; try_files /TV-Morph-Phone-0.8.2.apk =404; }
 location ~ \.apk$ { default_type application/vnd.android.package-archive; add_header Content-Disposition 'attachment'; add_header Cache-Control 'public, max-age=3600'; try_files $uri =404; }
 location / { try_files $uri $uri/ =404; }
}
