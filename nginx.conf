limit_req_zone $binary_remote_addr zone=community_api:10m rate=10r/s;
server {
 location = /packs/adhan/voices-v1.zip {
  alias /usr/share/nginx/html/Morph-TV-Adhan-Voices-v1.zip;
  default_type application/zip;
  add_header Cache-Control "public, max-age=31536000, immutable";
  add_header Content-Disposition 'attachment; filename="Morph-TV-Adhan-Voices-v1.zip"';
 }

 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 charset utf-8;
 server_tokens off;
 # Only trust the private Docker ingress network, never public request headers.
 set_real_ip_from 172.16.0.0/12;
 set_real_ip_from 10.0.0.0/8;
 real_ip_header X-Forwarded-For;
 real_ip_recursive on;
 client_max_body_size 8k;
 location = /api/plus/webhook {
  client_max_body_size 256k;
  access_log off;
  proxy_pass http://127.0.0.1:8081;
  proxy_set_header Host $host;
  proxy_set_header X-Client-IP $remote_addr;
  proxy_connect_timeout 3s;
  proxy_read_timeout 35s;
  add_header Cache-Control 'no-store' always;
 }
 location = /api/iptv-link {
  client_max_body_size 3m;
  access_log off;
  proxy_pass http://127.0.0.1:8081;
  proxy_set_header X-Client-IP $remote_addr;
  proxy_connect_timeout 3s;
  proxy_read_timeout 25s;
  add_header Cache-Control 'no-store' always;
 }
 location /q/ {
  add_header Cache-Control 'no-store' always;
  add_header Referrer-Policy 'no-referrer' always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
  try_files $uri $uri/ =404;
 }
 location ^~ /api/ {
  access_log off;
  limit_req zone=community_api burst=20 nodelay;
  proxy_pass http://127.0.0.1:8081;
  proxy_set_header Host $host;
  proxy_set_header X-Client-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 3s;
  proxy_read_timeout 35s;
  proxy_no_cache 1;
  add_header Cache-Control 'no-store' always;
  add_header X-Content-Type-Options nosniff always;
 }
 location = /download/windows {
  add_header Cache-Control "no-store" always;
  return 302 https://github.com/karim-shousha/tv-morph/releases/download/desktop-v1.1.320/Morph-Launcher-PC-1.1.320-Setup.exe;
 }
 location = /download/mac {
  add_header Cache-Control "no-store" always;
  return 302 https://github.com/karim-shousha/tv-morph/releases/download/desktop-v1.1.320/Morph-Launcher-Mac-1.1.320-universal.dmg;
 }
 location = /download/remote {
  default_type application/vnd.android.package-archive;
  add_header Content-Disposition 'attachment; filename="Morph-Remote-1.1.305.apk"';
  add_header Cache-Control 'no-store' always;
  try_files /Morph-Remote-1.1.305.apk =404;
 }
 location ^~ /download/ {
  proxy_intercept_errors on;
  error_page 502 503 504 = @download_fallback;
  proxy_pass http://127.0.0.1:8081;
  proxy_set_header X-Client-IP $remote_addr;
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;
 }
 location ~ ^/(?:Morph-(?:TV|IPTV|Bridge)|Cleaner)-[A-Za-z0-9.-]+\.(apk|ipk|wgt)$ {
  proxy_intercept_errors on;
  error_page 502 503 504 = @download_fallback;
  proxy_pass http://127.0.0.1:8081;
  proxy_set_header X-Client-IP $remote_addr;
 }
 location @download_fallback {
  default_type application/octet-stream;
  add_header Content-Disposition 'attachment; filename="$morph_download_filename"';
  add_header Cache-Control 'no-store';
  try_files $morph_download_fallback =404;
 }
 location ^~ /_artifacts/theme-packs/ {
  internal;
  alias /usr/share/nginx/html/theme-packs/;
  add_header Access-Control-Allow-Origin '*' always;
  add_header Cache-Control 'no-store' always;
  add_header X-Content-Type-Options nosniff always;
 }
 location ^~ /_artifacts/ {
  internal;
  alias /usr/share/nginx/html/;
 }
 location = /community-admin {
  add_header X-Robots-Tag 'noindex, nofollow, noarchive' always;
  add_header Cache-Control 'no-store' always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'" always;
  try_files /community-admin.html =404;
 }
 location = /community-admin.html { return 302 /community-admin; }
 location = /plus-admin {
  add_header X-Robots-Tag 'noindex, nofollow, noarchive' always;
  add_header Cache-Control 'no-store' always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'" always;
  try_files /plus-admin.html =404;
 }
 location = /plus-admin.html { return 302 /plus-admin; }
 location = /plus-admin.js { add_header Cache-Control 'no-store' always; try_files $uri =404; }
 location = /plus-admin.css { add_header Cache-Control 'no-store'; try_files $uri =404; }

 if ($host ~* "^(www\.)?herroshetta\.com$") { return 404; }
 if ($host = www.morph-tv.com) { return 308 https://morph-tv.com$request_uri; }
 if ($host = www.morphtv.herroshetta.com) { return 308 https://morphtv.herroshetta.com$request_uri; }
 if ($morph_legacy_redirect) { return 308 https://morphtv.herroshetta.com$request_uri; }
 add_header Access-Control-Allow-Origin $morph_legacy_cors always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location ~* ^/(vidaa(-install)?\.html|vidaa-manifest\.json|TV-Morph-VIDAA-.*\.zip)$ { return 410; }
 location = /samsung-phone-install.html { return 302 "/?platform=samsung#tv/install"; }
 location = /samsung-computer.html { return 302 "/?platform=samsung#tv/install"; }
 location = /health { access_log off; default_type text/plain; return 200 'ok'; }
 location = /downloader-codes.json { add_header Access-Control-Allow-Origin '*' always; add_header Cache-Control 'no-store'; try_files $uri =404; }
 location = /catalog.json { add_header Access-Control-Allow-Origin '*' always; add_header Cache-Control 'no-store'; try_files $uri =404; }
 # The public landing page previously linked this path as the latest test build.
 # Keep the old test link on the current release notes.
 location = /releases/0.8.245/ { return 302 https://morph-tv.com/releases/1.1.321/README.md; }
 location = /releases/0.8.271/ { return 302 https://morph-tv.com/releases/1.1.321/README.md; }
 location ~ ^/theme-packs/europe-v2-(barcelona-team|barcelona|madrid-team|madrid)\.webp$ { add_header Access-Control-Allow-Origin "*" always; add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
 location ~ ^/theme-packs/(europe|hockey|sports|national|saudi-clubs|saudi-royal|saudi|inter-miami)- { return 403; }
 location /theme-packs/ { add_header Access-Control-Allow-Origin '*' always; try_files $uri =404; }
 location /fitness-music/ { add_header Access-Control-Allow-Origin '*' always; add_header Cache-Control 'public, max-age=604800'; try_files $uri =404; }
 location /site-assets/ { add_header Cache-Control 'public, max-age=3600'; try_files $uri =404; }
 location = / { add_header Cache-Control 'no-cache'; try_files /index.html =404; }
 location / { try_files $uri $uri/ =404; }
}
