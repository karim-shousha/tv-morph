server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 charset utf-8;
 server_tokens off;
 if ($host ~* "^(www\.)?tvmorph\.zainbot\.com$") { return 308 https://morphtv.zainbot.com$request_uri; }
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location = /health { access_log off; default_type text/plain; return 200 'ok'; }
 location = /catalog.json { add_header Access-Control-Allow-Origin '*' always; add_header Cache-Control 'no-store'; try_files $uri =404; }
 location = /download/phone { default_type application/vnd.android.package-archive; add_header Content-Disposition 'attachment; filename="Morph-TV-Phone-0.8.85.apk"'; add_header Cache-Control 'no-cache'; try_files /Morph-TV-Phone-0.8.85.apk =404; }
 location = /download/android { default_type application/vnd.android.package-archive; add_header Content-Disposition 'attachment; filename="Morph-TV-Android-TV-0.8.85.apk"'; add_header Cache-Control 'no-cache'; try_files /Morph-TV-Android-TV-0.8.85.apk =404; }
 location = /download/firetv { default_type application/vnd.android.package-archive; add_header Content-Disposition 'attachment; filename="Morph-TV-Android-TV-0.8.85.apk"'; add_header Cache-Control 'no-cache'; try_files /Morph-TV-Android-TV-0.8.85.apk =404; }
 location = /download/lg-preview { default_type application/octet-stream; add_header Content-Disposition 'attachment; filename="Morph-TV-LG-Preview-0.1.4.ipk"'; add_header Cache-Control 'no-cache'; try_files /Morph-TV-LG-Preview-0.1.4.ipk =404; }
 location ~ \.apk$ { default_type application/vnd.android.package-archive; add_header Content-Disposition 'attachment'; try_files $uri =404; }
 location /site-assets/ { add_header Cache-Control 'public, max-age=3600'; try_files $uri =404; }
 location = / { add_header Cache-Control 'no-cache'; try_files /index.html =404; }
 location / { try_files $uri $uri/ =404; }
}
