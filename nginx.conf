 ~^/(Morph-(?:TV|IPTV|Bridge)-[A-Za-z0-9.-]+\.(apk|ipk|wgt))$ /$1;
 /download/samsung-tizen2 /Morph-TV-Samsung-Tizen2-1.1.321.wgt;
 /download/samsung-tizen3 /Morph-TV-Samsung-Tizen3-1.1.321.wgt;
 /download/samsung-tizen4 /Morph-TV-Samsung-Tizen4-1.1.321.wgt;
